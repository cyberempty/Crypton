[package]
name = "crypton"
version = "1.0.0"
description = "Crypton: file encryption and steganography"
edition = "2024"

[dependencies]
argon2 = { version = "0.6.0", features = ["zeroize"] }
chacha20poly1305 = "0.11.0"
crc32fast = "1.5.4"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp"] }
rfd = "0.18.0"
zeroize = "1.9.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Linux only (future version): selects the windowing systems.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }

[build-dependencies]
embed-resource = "3.0.12"
